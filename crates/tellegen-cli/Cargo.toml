[package]
name = "tellegen-cli"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Command line interface for PowerIO module solves and capacity planning."

[[bin]]
name = "tellegen"
path = "src/main.rs"

[dependencies]
# Default features (sensitivity): the convex/relaxation engine.
tellegen = { path = "../tellegen", features = ["schema"] }
# The stored module boundary the headless MCP workflow speaks: read the
# case module, narrow to the typed instance, write the solution module.
powerio.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
