[package]
name = "tellegen-acopf-wasi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Development-only WASI adapter for Tellegen's POUNCE AC OPF solver."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Workspace builds must not unify tellegen/acopf into shipping adapters.
default = []
# No-op alias kept for existing build commands; PowerIO 0.12 is the shipping
# dependency (see the `tellegen` crate's `powerio-012` feature).
powerio-012 = ["tellegen?/powerio-012"]
acopf = ["dep:tellegen"]

[dependencies]
serde_json.workspace = true
tellegen = { path = "../tellegen", optional = true, default-features = false, features = ["acopf"] }

[lints]
workspace = true
