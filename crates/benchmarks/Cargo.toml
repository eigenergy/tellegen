[package]
name = "benchmarks"
version = "0.0.0"
edition.workspace = true
publish = false
license = "MIT"
description = "Private native PGLib-OPF validation and multiconductor session benchmark harness for tellegen."

[lib]
path = "src/lib.rs"

[[bin]]
name = "pglib-bench"
path = "src/main.rs"

# Retained multiconductor PF session latency and memory (eigenergy/tellegen#132).
[[bin]]
name = "mc-pf-session-bench"
path = "src/bin/mc-pf-session-bench.rs"

[dependencies]
# The engine, with the conic (SOCWR) relaxation on for parity coverage alongside the
# DC and AC power flow paths. The shared workspace lockfile unifies powerio across the
# API boundary.
tellegen = { path = "../tellegen", features = ["conic"] }
powerio.workspace = true
# The synthetic multiconductor feeders are built directly as PowerIO
# distribution networks and typed AC PF instances.
powerio-dist.workspace = true
powerio-prob.workspace = true
walkdir = "2"
rayon = "1"
csv = "1"
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
