[package]
name = "tellegen-py"
# Tracks the engine crate so `pip install tellegen==X` and `cargo add tellegen@X`
# mean the same solver. release-plz does not touch this crate; the crate release
# workflow sets this version and its Cargo.lock entry to the engine's after
# release-plz updates it (.github/scripts/sync_python_version.py).
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Python bindings for the tellegen power flow engine."

[lib]
name = "_tellegen"
crate-type = ["cdylib"]

[features]
# Opt-in so a bare `cargo build`, `cargo test --workspace` and `cargo clippy`
# never link libpython. maturin turns it on through pyproject's
# `[tool.maturin] features`.
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
# No `version` field, deliberately: this unpublished adapter uses the workspace
# engine directly. The release workflow changes only this package's own
# version, and `.github/scripts/validate-version-changes.py` rejects any other
# change to this manifest in a release patch.
#
# `conic` implies `sensitivity`, which carries DC PF, DC OPF, AC PF and the KKT
# sensitivities. `mc-pf` is deliberately absent: multiconductor power flow is
# out of the first Python release's scope, so it is not compiled in.
tellegen = { path = "../tellegen", default-features = false, features = ["conic"] }
# Case parsing lives in powerio, not tellegen: `tellegen::ir` only moves IR
# text. Binding it here keeps the wheel self-contained, so the base package has
# no runtime dependency on the powerio Python wheel.
powerio.workspace = true
# abi3 gives one wheel per platform for CPython 3.9 and newer, which is what
# keeps PowerMCP from needing a per-version support gate (as surge-py does).
pyo3 = { version = "0.30", features = ["abi3-py39"] }
serde_json.workspace = true

[lints]
workspace = true
