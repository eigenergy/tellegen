[package]
name = "tellegen-wasm"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "WebAssembly browser adapter for the tellegen power flow engine."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine. The default wasm build keeps the lightweight core; `mc-pf`,
# `sensitivity`, and `conic` opt into their numerical backends explicitly.
tellegen = { path = "../tellegen", default-features = false }
powerio.workspace = true
powerio-dist.workspace = true
powerio-tx.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde.workspace = true
serde_json.workspace = true
# Forwards Rust panics to a readable console.error with a JS stack, instead of the bare
# `unreachable` trap a wasm panic otherwise surfaces. Installed once per entry point.
console_error_panic_hook = "0.1"

[features]
default = []
# The multiconductor fixed-point PF and its raw BMOPF entry point.
mc-pf = ["tellegen/mc-pf"]
# Gates the `#[wasm_bindgen] Study` export and the dLMP/dd column in `solve_dc`.
sensitivity = ["tellegen/sensitivity"]
# The SOCWR (Jabr) conic relaxation. Pulls `sensitivity` so the Study export stays
# present, mirroring the engine's `conic = ["sensitivity"]`.
conic = ["sensitivity", "mc-pf", "tellegen/conic"]

[lints]
workspace = true
