[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "tellegen"
# Read from crates/tellegen-py/Cargo.toml by maturin, so the wheel and the crate
# carry one version.
dynamic = ["version"]
description = "AC and DC power flow, optimal power flow, transmission switching, and KKT sensitivities."
readme = "README.md"
license = "MIT AND EPL-2.0"
license-files = ["LICENSE", "licenses/POUNCE-EPL-2.0.txt", "licenses/POUNCE-PYTHON-NOTICE.txt"]
requires-python = ">=3.11"
keywords = ["opf", "power-flow", "power-systems", "sensitivity", "lmp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
]
# The base package has no runtime dependencies: case parsing is compiled in
# through the powerio Rust crates, not imported from the powerio wheel.
dependencies = []

[project.optional-dependencies]
switching = ["pyscipopt>=6.3,<7", "networkx>=3,<4"]
# The MCP server. `mcp` 2.x moved the server class to
# `mcp.server.mcpserver.MCPServer`. `powerio` supplies the filesystem path policy
# (`powerio.mcp.sandbox`), which is shared with PowerMCP rather than copied.
# It also reads source files and the PowerIO IR the engine writes, so its
# minimum version matches the engine's qualified readers.
# `pydantic` is imported directly by `tellegen.mcp` for its tool argument
# schemas, so it is declared here and not left to arrive through `mcp`.
mcp = [
  "mcp>=2,<3",
  "powerio>=0.12.5,<0.13",
  "pydantic>=2,<3",
]

[project.scripts]
# Serves the tellegen.mcp tool surface over stdio. Needs the `mcp` extra.
tellegen-mcp = "tellegen.mcp:main"

[project.urls]
Homepage = "https://tellegen.dev"
Documentation = "https://eigenergy.github.io/tellegen/"
Repository = "https://github.com/eigenergy/tellegen"

[tool.maturin]
manifest-path = "crates/tellegen-py/Cargo.toml"
module-name = "tellegen._tellegen"
python-source = "python"
features = ["extension-module", "ots"]
# Not the root `release` profile: that one is opt-level = "s" for wasm size.
profile = "release-py"
strip = true
include = [{ path = "LICENSE", format = "sdist" }, { path = "licenses/POUNCE-EPL-2.0.txt", format = ["sdist", "wheel"] }, { path = "licenses/POUNCE-PYTHON-NOTICE.txt", format = ["sdist", "wheel"] }]
# These are validation fixtures, not inputs required by the installed solver.
# Keep their independent data licences out of the Python source distribution.
exclude = ["**/tests/data/**", "**/tests/fixtures/**"]
