# Supply-chain governance for the tellegen workspace.
#
# Every crate in the default shipping graph must carry a permissive license.
# POUNCE is EPL-2.0 and appears only behind the opt-in native `tellegen/acopf`
# development feature. The exceptions below identify that reviewed family;
# scripts/epl-guard.sh separately proves it is absent from shipping adapters.

[licenses]
# Anything not listed here is denied. Permissive licenses only; copyleft is excluded
# by omission.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

# `target-lexicon` is a pyo3 build dependency (through pyo3-build-config) and is
# the only crate in the tree under an SPDX `WITH` expression. Scoped here rather
# than widening `allow` above, so the allow-list stays closed and this one
# build-time crate is the documented exception. It links into no shipped
# artifact: only `crates/tellegen-py` reaches it, at build time.
[[licenses.exceptions]]
name = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]

# POUNCE is a single EPL-2.0 program split into crates. Keep this list explicit
# so another copyleft dependency cannot enter under a broad license allowance.
[[licenses.exceptions]]
name = "pounce-algorithm"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-common"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-feral"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-l1penalty"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-linalg"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-linsol"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-nl"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-nlp"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-observability"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-presolve"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-qp"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-restoration"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-rs"
allow = ["EPL-2.0"]

[[licenses.exceptions]]
name = "pounce-solve-report"
allow = ["EPL-2.0"]

[advisories]
# RustSec advisory DB. Security advisories fail the check; add IDs to `ignore` only
# with a documented rationale.
yanked = "deny"
ignore = [
    # `paste` (proc-macro helper) was archived by its author — an unmaintained notice,
    # not a vulnerability. Pulled in transitively by faer -> gemm -> pulp for SIMD
    # codegen; there is no safe upgrade until that matmul stack drops it. Re-evaluate
    # on faer upgrades. https://rustsec.org/advisories/RUSTSEC-2024-0436
    "RUSTSEC-2024-0436",
]

[bans]
# Surface accidental duplicate versions without failing the build.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# PowerIO candidate dependencies use the same repository and immutable revision.
allow-git = [
    "https://github.com/eigenergy/powerio",
    # Immutable POUNCE gh#961 head used by the AC OPF feasibility probe.
    "https://github.com/jkitchin/pounce",
]
