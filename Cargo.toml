[workspace]
# The engine plus its three adapters and the non-shipping validation harness.
# `default-members` keeps a bare `cargo build`/`cargo test`/wasm gate scoped to the
# engine; the adapters and benchmarks build only when a command selects them.
members = [
  "crates/tellegen",
  "crates/tellegen-synth",
  "crates/tellegen-wasm",
  "crates/tellegen-acopf-wasi",
  "crates/tellegen-server",
  "crates/tellegen-cli",
  "crates/tellegen-py",
  "crates/benchmarks",
]
default-members = ["crates/tellegen"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/eigenergy/tellegen"

[workspace.dependencies]
# PowerIO modules, values, problem instances, solutions, and numerical
# preparation supply Tellegen's network data. The shared lockfile keeps
# one exact PowerIO revision across the engine and every adapter.
# No SINCAL: `powerio` turns off its default `sincal` feature, which compiles
# SQLite that the wasm build could only link with a C compiler targeting
# WebAssembly, and `powerio-dist` and `powerio-tx` come without default
# features so none arrives through them. Tellegen reads no SINCAL projects.
powerio = { version = "0.11.6", default-features = false }
# The multiconductor distribution model and its lossless readers for OpenDSS,
# PMD JSON, and BMOPF JSON. The wasm ingest path views distribution cases
# through `MulticonductorNetwork::to_graph()` (no solve). Browser ingestion
# remains filesystem free, so OpenDSS include commands are refused because
# there is no base directory to confine them to.
powerio-dist = { version = "0.11.6", default-features = false }
# Lower level analysis views used only inside Tellegen's private solver and
# display workspaces. Portable inputs and outputs still cross the `powerio`
# module facade.
powerio-tx = { version = "0.11.6", default-features = false }
# Typed problem instances and solutions (`DcOpfInstance`, `DcOpfSolution`, ...),
# the shared owner of case interpretation.
powerio-prob = "0.11.6"
# The shared numerical assembly: `build_dc_opf_preparation` derives the matrix
# free DC OPF arrays (demand, costs, bounds, limits, mappings) from a
# `DcOpfInstance`, so the solver formulates over PowerIO's one assembly
# instead of re-deriving it from the network.
powerio-matrix = "0.11.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
# Both halves of the opt-in AC OPF backend use the same published release.
# Tellegen explicitly installs restoration and second-opinion recovery.
# No shipping adapter enables these dependencies.
pounce-nl = "=0.13.0"
pounce-rs = "=0.13.0"

# Shared lints, opted into per crate with `[lints] workspace = true`. Kept modest so a
# `cargo clippy -- -D warnings` CI gate stays green: clippy's default `all`, plus guards
# against a stray `todo!`/`dbg!` reaching a shipped build.
[workspace.lints.clippy]
all = "warn"
todo = "warn"
dbg_macro = "warn"

# Profiles only take effect at the workspace root. `opt-level = "s"` + `lto` keep the
# browser wasm small (the size constraint that matters for the shipped app); the
# server inherits the same release profile.
[profile.release]
opt-level = "s"
lto = true

# The Python wheel's profile. `release` above is tuned for wasm binary size;
# Clarabel and faer want speed on native hardware. Selected explicitly with
# `maturin build --profile release-py`, so no other build is affected.
[profile.release-py]
inherits = "release"
opt-level = 3
lto = "thin"
