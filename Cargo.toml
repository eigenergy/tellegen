[workspace]
# The engine plus its three adapters and the non-shipping validation harness.
# `default-members` keeps a bare `cargo build`/`cargo test`/wasm gate scoped to the
# engine; the adapters and benchmarks build only when a command selects them.
members = [
  "crates/tellegen",
  "crates/tellegen-wasm",
  "crates/tellegen-server",
  "crates/tellegen-cli",
  "crates/benchmarks",
]
default-members = ["crates/tellegen"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/eigenergy/tellegen"

[workspace.dependencies]
# PowerIO modules, values, problem instances, solutions, and numerical
# preparation are Tellegen's public data boundary. The shared lockfile keeps
# one exact PowerIO revision across the engine and every adapter.
powerio = "0.11"
# The multiconductor distribution model and its lossless readers for OpenDSS,
# PMD JSON, and BMOPF JSON. The wasm ingest path views distribution cases
# through `MulticonductorNetwork::graph()` (no solve). Browser ingestion
# remains filesystem free, so OpenDSS include commands are refused because
# there is no base directory to confine them to.
powerio-dist = "0.11"
# Typed problem instances and solutions (`DcOpfInstance`, `DcOpfSolution`, ...),
# the shared owner of case interpretation.
powerio-prob = "0.11"
# The shared numerical assembly: `build_dc_opf_preparation` derives the matrix
# free DC OPF arrays (demand, costs, bounds, limits, mappings) from a
# `DcOpfInstance`, so the solver formulates over PowerIO's one assembly
# instead of re-deriving it from the network.
powerio-matrix = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }

# The reviewed PowerIO 0.11 candidate from eigenergy/powerio#453. Keep the
# exact revision and the lockfile in the same commit; remove this patch after
# 0.11.0 is published.
[patch.crates-io]
powerio = { git = "https://github.com/eigenergy/powerio.git", rev = "7a17cafdf31b3094aaeda318152fc518d5574ab9" }
powerio-core = { git = "https://github.com/eigenergy/powerio.git", rev = "7a17cafdf31b3094aaeda318152fc518d5574ab9" }
powerio-tx = { git = "https://github.com/eigenergy/powerio.git", rev = "7a17cafdf31b3094aaeda318152fc518d5574ab9" }
powerio-dist = { git = "https://github.com/eigenergy/powerio.git", rev = "7a17cafdf31b3094aaeda318152fc518d5574ab9" }
powerio-prob = { git = "https://github.com/eigenergy/powerio.git", rev = "7a17cafdf31b3094aaeda318152fc518d5574ab9" }
powerio-matrix = { git = "https://github.com/eigenergy/powerio.git", rev = "7a17cafdf31b3094aaeda318152fc518d5574ab9" }

# Shared lints, opted into per crate with `[lints] workspace = true`. Kept modest so a
# `cargo clippy -- -D warnings` CI gate stays green: clippy's default `all`, plus guards
# against a stray `todo!`/`dbg!` reaching a shipped build.
[workspace.lints.clippy]
all = "warn"
todo = "warn"
dbg_macro = "warn"

# Profiles only take effect at the workspace root. `opt-level = "s"` + `lto` keep the
# browser wasm small (the size constraint that matters for the shipped app); the
# server inherits the same release profile.
[profile.release]
opt-level = "s"
lto = true
