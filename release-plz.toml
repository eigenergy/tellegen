[workspace]
release = false
release_always = false
git_tag_name = "v{{ version }}"
git_release_name = "tellegen v{{ version }}"
git_release_enable = true
git_release_draft = false
# Dependabot owns dependency updates. Keep this off, or a bump can reach
# crates.io without a run of the gates.
dependencies_update = false

[changelog]
protect_breaking_commits = true
# Skip merge commits: their changes arrive with the commits they merge, which
# have entries of their own. Setting `commit_parsers` replaces release-plz's
# defaults rather than adding to them, so its Keep a Changelog groups are
# restated after the skip; a lone catch-all would file every `feat:` under
# Other.
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "added" },
  { message = "^changed", group = "changed" },
  { message = "^deprecated", group = "deprecated" },
  { message = "^removed", group = "removed" },
  { message = "^fix", group = "fixed" },
  { message = "^security", group = "security" },
  { message = ".*", group = "other" },
]
# release-plz rewrites this header on every run and inserts releases below it,
# so prose kept here stays at the top. Prose left in the file itself would be
# pushed under the newest release and sink further with each one.
header = """# Changelog

Written by release-plz from the commits between tags. Releases through 0.1.1,
when all three surfaces moved together, are in the
[root `CHANGELOG.md`](../../CHANGELOG.md).
"""

[[package]]
name = "tellegen"
changelog_path = "crates/tellegen/CHANGELOG.md"
release = true
publish = true
# API comparison runs in read-only pull-request CI, without the Release App
# token that release-plz needs to update its version branch.
semver_check = false

# Future crates inherit the workspace deny and require an explicit `release = true`.
[[package]]
name = "tellegen-wasm"
release = false
# Mirror `publish = false` in this crate's Cargo.toml. release-plz defaults a
# package to publishable and refuses to run when the two disagree.
publish = false

[[package]]
name = "tellegen-server"
release = false
# Mirror `publish = false` in this crate's Cargo.toml. release-plz defaults a
# package to publishable and refuses to run when the two disagree.
publish = false

[[package]]
# The PyO3 extension. Never released by release-plz: after release-plz updates
# the engine, the crate release workflow sets this package's version and its
# Cargo.lock entry to the engine's (.github/scripts/sync_python_version.py).
# The wheel ships through PyPI, not crates.io.
name = "tellegen-py"
release = false
publish = false

[[package]]
name = "tellegen-cli"
release = false
# Mirror `publish = false` in this crate's Cargo.toml. release-plz defaults a
# package to publishable and refuses to run when the two disagree.
publish = false

[[package]]
name = "benchmarks"
release = false
# Mirror `publish = false` in this crate's Cargo.toml. release-plz defaults a
# package to publishable and refuses to run when the two disagree.
publish = false
