# release-plz drives the crate half of the release: it watches main, keeps a
# version-bump pull request open describing what would ship, and on the merge of
# that pull request it tags, cuts the GitHub release, and publishes to crates.io.
#
# The npm half is changesets (`.changeset/config.json`). The two are independent
# on purpose — a change confined to `packages/svelte` should not move the crate,
# which is the versioning policy `docs/src/release-architecture.md` already
# states and which the repository's own history follows (0.1.2 shipped
# `@tellegen/svelte` alone).

[workspace]
# Keeps the tag namespace the repository already used, so `tellegen-vX.Y.Z`
# still means "the crate at X.Y.Z" across the whole history.
git_tag_name = "tellegen-v{{ version }}"
git_release_name = "tellegen v{{ version }}"
git_release_enable = true
# A published release, not a draft: the approval gate for this repository is the
# `crates-io` deployment environment on the publish job, which is a stronger
# check than a draft (it is enforced by GitHub rather than by convention, and it
# sits between the decision and the registry rather than before it).
git_release_draft = false

# powerio bumps arrive as their own dependabot pull requests with CI attached.
# Letting the release bot also rewrite the lockfile would mean a dependency
# moved without a run of the gates against it.
dependencies_update = false

# Conventional-commit subjects are not this repository's convention; the commit
# bodies carry the reasoning instead. Keep every commit in the notes rather than
# silently dropping the ones that do not parse.
[changelog]
protect_breaking_commits = true

[[package]]
name = "tellegen"
changelog_path = "crates/tellegen/CHANGELOG.md"
# `crates/tellegen/README.md` is what crates.io renders.
publish = true

# The adapters and the benchmark harness carry `publish = false` in their
# manifests and depend on the engine by path, so they neither ship nor need a
# synchronized version. Stated here too so that adding a publishable crate is a
# deliberate edit in this file rather than a silent inclusion.
[[package]]
name = "tellegen-wasm"
release = false

[[package]]
name = "tellegen-server"
release = false

[[package]]
name = "tellegen-cli"
release = false

[[package]]
name = "benchmarks"
release = false
