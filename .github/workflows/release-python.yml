name: Release (Python)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable crate release tag to publish on PyPI.
        required: true
        type: string

permissions: {}

# PyPI authenticates this top-level workflow. release-crate dispatches it after
# publication; reusable workflows are not supported as PyPI trusted publishers.

concurrency:
  group: release-python-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  source:
    if: vars.TELLEGEN_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the released source
        id: source
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          revision=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$revision" origin/main
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          git show "$revision:crates/tellegen-py/Cargo.toml" > "$RUNNER_TEMP/python-crate.toml"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$RUNNER_TEMP/python-crate.toml" | head -1)
          test "v$version" = "$TAG"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gates:
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/gates-python.yml
    with:
      source_ref: ${{ needs.source.outputs.revision }}

  publish:
    needs: [source, gates]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tellegen/${{ needs.source.outputs.version }}/
    permissions:
      id-token: write
    steps:
      # The publisher only receives the tested archives. It never checks out
      # repository code or runs a build with the OIDC permission.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Publish tested wheels and source archive
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
