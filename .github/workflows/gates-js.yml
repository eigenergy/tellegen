name: Gates (js)

# CI and the npm release call this. Add a JavaScript gate here, not in a caller.
# Concurrency comes from the caller: do not add a group here, or a release will
# queue behind a CI run.

on:
  workflow_call:

permissions: {}

jobs:
  js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/js-setup

      # Cheapest deterministic gates first, so a formatting error does not wait for a browser.
      - run: npm run lint:web
      - run: npm run check:webmcp
      - run: npm run pack:webmcp
      - run: npm run wasm
      - run: npm run check:engine
      - run: npm run build:engine
      - run: npm run test:import
      - run: npm run check:svelte
      - run: npm run test:svelte
      - run: npm run check:web
      - run: npm run test:svelte-packed
      # Call the frontend build directly. `build:web` rebuilds @tellegen/svelte,
      # which `check:web` above already built.
      - run: npm --workspace tellegen-frontend run build
      - run: npm run smoke:web
      - run: npm --workspace tellegen-frontend exec playwright install --with-deps chromium
      - run: npm run test:browser
      # The npm counterpart of cargo-deny. Keep this mandatory, but run it
      # after deterministic checks: a registry outage must not conceal their
      # results. The line is `high`. Below it sit a SvelteKit request handling
      # advisory and the cookie parser under it, neither of which the shipped
      # artifact runs: apps/web builds static through adapter-static, and
      # tellegen-server serves the files.
      - if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
