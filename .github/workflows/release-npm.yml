name: Release (packages)

# Setup for this workflow is in docs/src/release-architecture.md.
#
# The npm trusted publisher binds to this filename. If you rename this file,
# update the publisher on npmjs.com for both packages first.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Do not cancel a run that may already be publishing.
concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  gates-rust:
    if: vars.TELLEGEN_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/gates-rust.yml

  gates-js:
    if: vars.TELLEGEN_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/gates-js.yml

  select-mode:
    if: github.ref == 'refs/heads/main'
    name: choose version or publish
    needs: [gates-rust, gates-js]
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0

  version:
    if: needs.select-mode.outputs.mode == 'version'
    name: version pull request
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - name: Version packages
        uses: changesets/action/version@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: npm run version:packages
          commit-message: Release packages
          pr-title: Release packages

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    name: build and pack packages
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/js-setup
        with:
          node-version: 24
          npm-cache: "false"
      - name: Build packages
        run: npm run wasm && npm run build:engine && npm run build:svelte
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: publish to npm
    needs: pack
    runs-on: ubuntu-latest
    # The merged version PR is the human gate. This environment binds the OIDC
    # publisher to main; it should not add a second reviewer pause.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts

      - name: Publish packages
        uses: changesets/action/publish@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
