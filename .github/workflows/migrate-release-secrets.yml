name: Migrate release secrets

# Temporary migration for issue 259. Only sealed ciphertext leaves the runner;
# the fixed recipients below are GitHub's public keys for these environments.
# Remove this workflow after the environment copies have been verified.
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [seal, verify]
        required: true
        default: seal

permissions: {}

jobs:
  seal:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'seal'
    runs-on: ubuntu-latest
    steps:
      - name: Install the sealed-box implementation
        run: python3 -m pip install PyNaCl==1.6.2
      - name: Encrypt directly to the GitHub environment keys
        env:
          RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          TELLEGEN_DEMO_URL: ${{ secrets.TELLEGEN_DEMO_URL }}
          TELLEGEN_DEPLOY_HOST: ${{ secrets.TELLEGEN_DEPLOY_HOST }}
          TELLEGEN_DEPLOY_KNOWN_HOSTS: ${{ secrets.TELLEGEN_DEPLOY_KNOWN_HOSTS }}
          TELLEGEN_DEPLOY_PATH: ${{ secrets.TELLEGEN_DEPLOY_PATH }}
          TELLEGEN_DEPLOY_SSH_KEY: ${{ secrets.TELLEGEN_DEPLOY_SSH_KEY }}
          TELLEGEN_DEPLOY_USER: ${{ secrets.TELLEGEN_DEPLOY_USER }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          recipients = {
              'release-bot': ('TWp89FVF5Zoj9Sl16i2bJnynZwHgvWQ1Mlikco0C+mY=', ['RELEASE_PLZ_APP_PRIVATE_KEY']),
              'demo': ('FX/nMcLlVKZJw1RAkd+6HXHGn3K5S0uSuVlmLiJNW2w=', [
                  'TELLEGEN_DEMO_URL', 'TELLEGEN_DEPLOY_HOST', 'TELLEGEN_DEPLOY_KNOWN_HOSTS',
                  'TELLEGEN_DEPLOY_PATH', 'TELLEGEN_DEPLOY_SSH_KEY', 'TELLEGEN_DEPLOY_USER']),
          }
          encrypted = []
          for environment, (public_key, names) in recipients.items():
              box = SealedBox(PublicKey(base64.b64decode(public_key)))
              for name in names:
                  value = os.environ[name]
                  if not value:
                      raise SystemExit(f'Missing repository secret: {name}')
                  encrypted.append({'environment': environment, 'name': name,
                      'key_id': '3380204578043523366',
                      'encrypted_value': base64.b64encode(box.encrypt(value.encode())).decode()})
          Path('sealed-secrets.json').write_text(json.dumps(encrypted))
          print(f'Sealed {len(encrypted)} secrets to the fixed GitHub environment recipients')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealed-environment-secrets
          path: sealed-secrets.json
          retention-days: 1

  verify:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'verify'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [demo, release-bot]
    environment: ${{ matrix.environment }}
    steps:
      - name: Check the environment receives its credentials
        env:
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          TELLEGEN_DEMO_URL: ${{ secrets.TELLEGEN_DEMO_URL }}
          TELLEGEN_DEPLOY_HOST: ${{ secrets.TELLEGEN_DEPLOY_HOST }}
          TELLEGEN_DEPLOY_KNOWN_HOSTS: ${{ secrets.TELLEGEN_DEPLOY_KNOWN_HOSTS }}
          TELLEGEN_DEPLOY_PATH: ${{ secrets.TELLEGEN_DEPLOY_PATH }}
          TELLEGEN_DEPLOY_SSH_KEY: ${{ secrets.TELLEGEN_DEPLOY_SSH_KEY }}
          TELLEGEN_DEPLOY_USER: ${{ secrets.TELLEGEN_DEPLOY_USER }}
          MIGRATED_RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.MIGRATED_RELEASE_PLZ_APP_PRIVATE_KEY }}
          MIGRATED_TELLEGEN_DEMO_URL: ${{ secrets.MIGRATED_TELLEGEN_DEMO_URL }}
          MIGRATED_TELLEGEN_DEPLOY_HOST: ${{ secrets.MIGRATED_TELLEGEN_DEPLOY_HOST }}
          MIGRATED_TELLEGEN_DEPLOY_KNOWN_HOSTS: ${{ secrets.MIGRATED_TELLEGEN_DEPLOY_KNOWN_HOSTS }}
          MIGRATED_TELLEGEN_DEPLOY_PATH: ${{ secrets.MIGRATED_TELLEGEN_DEPLOY_PATH }}
          MIGRATED_TELLEGEN_DEPLOY_SSH_KEY: ${{ secrets.MIGRATED_TELLEGEN_DEPLOY_SSH_KEY }}
          MIGRATED_TELLEGEN_DEPLOY_USER: ${{ secrets.MIGRATED_TELLEGEN_DEPLOY_USER }}
        run: |
          python3 - <<'PY'
          import hmac, os
          names = (['RELEASE_PLZ_APP_PRIVATE_KEY'] if os.environ['TARGET_ENVIRONMENT'] == 'release-bot'
              else ['TELLEGEN_DEMO_URL', 'TELLEGEN_DEPLOY_HOST', 'TELLEGEN_DEPLOY_KNOWN_HOSTS',
                    'TELLEGEN_DEPLOY_PATH', 'TELLEGEN_DEPLOY_SSH_KEY', 'TELLEGEN_DEPLOY_USER'])
          # Aliases exist only in the target environment, so repository-secret
          # fallback cannot make this check pass with a missing environment copy.
          for name in names:
              value = os.environ.get('MIGRATED_' + name, '')
              assert value and hmac.compare_digest(value, os.environ[name]), 'Migrated credential differs'
          print('Environment copies match the repository originals')
          PY
