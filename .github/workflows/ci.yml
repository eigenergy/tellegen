name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    permissions:
      contents: read
    uses: ./.github/workflows/gates-rust.yml

  js:
    permissions:
      contents: read
    uses: ./.github/workflows/gates-js.yml

  # deploy.yml builds the image only on a push to main. Without this job, a
  # Dockerfile break passes PR CI and fails after the merge.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test deployment recovery
        run: deploy/test-remote-deploy.sh
      - name: Test generated-version allowlists
        run: python3 .github/scripts/test-validate-version-changes.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image (load locally for the smoke test)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: tellegen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker rm -f tellegen-smoke >/dev/null 2>&1 || true
          docker run \
            --detach \
            --name tellegen-smoke \
            --publish 127.0.0.1:8000:8000 \
            --env TELLEGEN_ALLOW_FALLBACK=1 \
            --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            tellegen:ci
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/api/health && curl -fsS http://127.0.0.1:8000/ | grep -q 'tellegen'; then
              exit 0
            fi
            echo "waiting for container health ($attempt/90)"
            sleep 10
          done
          docker logs --tail=200 tellegen-smoke
          exit 1
      - name: Stop smoke container
        if: always()
        run: docker rm -f tellegen-smoke >/dev/null 2>&1 || true
