name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write anything; the release workflows own the surfaces
# that do. Declared explicitly because the repository default would otherwise
# apply, and a default that widens later would widen this silently.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same gates the release workflows run. See gates.yml for why they are
  # shared rather than restated.
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      suite: all

  # Build the shipped Docker image and smoke test it on PRs. deploy.yml only builds
  # the image on push to main, so without this a Dockerfile or workspace-config break
  # (e.g. a default-members change that desyncs the Dockerfile's `--bin` selection)
  # passes PR CI and only fails post-merge on the deploy. No GHCR push; PR-only so it
  # does not duplicate the image build deploy.yml already runs on main.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image (load locally for the smoke test)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: tellegen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker rm -f tellegen-smoke >/dev/null 2>&1 || true
          docker run \
            --detach \
            --name tellegen-smoke \
            --publish 127.0.0.1:8000:8000 \
            --env TELLEGEN_ALLOW_FALLBACK=1 \
            --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            tellegen:ci
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/api/health && curl -fsS http://127.0.0.1:8000/ | grep -q 'tellegen'; then
              exit 0
            fi
            echo "waiting for container health ($attempt/90)"
            sleep 10
          done
          docker logs --tail=200 tellegen-smoke
          exit 1
      - name: Stop smoke container
        if: always()
        run: docker rm -f tellegen-smoke >/dev/null 2>&1 || true
