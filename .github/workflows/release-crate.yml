name: Release (crate)

# Setup for this workflow is in docs/src/release-architecture.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Do not cancel a run. A stop between the publish and the tag leaves crates.io
# ahead of the repository.
concurrency:
  group: release-crate
  cancel-in-progress: false

jobs:
  gates:
    if: vars.TELLEGEN_RELEASE_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/gates-rust.yml

  release-pr:
    if: vars.TELLEGEN_RELEASE_ENABLED == 'true'
    name: version pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Use an app token, not GITHUB_TOKEN. A pull request that GITHUB_TOKEN
      # opens does not start a CI run.
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # release-plz takes the token through GITHUB_TOKEN and pushes with it.
      # Leaving it in .git/config would expose it to every build.rs that
      # release-plz compiles to work out the next version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: .
      - name: release-plz release-pr
        uses: MarcoIeni/release-plz-action@1a0c5beec2fe4e91727549b5d2d0715ed28684bb # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    if: github.ref == 'refs/heads/main'
    name: publish to crates.io
    needs: gates
    runs-on: ubuntu-latest
    # The reviewer rule is on the environment, in the repository settings. This
    # line alone does not gate the publish.
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: release-plz release
        uses: MarcoIeni/release-plz-action@1a0c5beec2fe4e91727549b5d2d0715ed28684bb # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
