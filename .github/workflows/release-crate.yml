name: Release (crate)

# Setup for this workflow is in docs/src/release-architecture.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-crate-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # Whether this push can publish. release-plz publishes only the commit that
  # merges its own pull request (release_always = false). That pull request
  # always writes crates/tellegen/CHANGELOG.md, which nothing else edits, and
  # merges a version with no `v<version>` tag yet. Only such a push runs the
  # gates and the publish job; any other push only refreshes the version pull
  # request, which runs CI itself. A version raised by hand on main stays
  # untagged until its release pull request merges, so the tag alone would
  # gate every push in between. When the tags or the diff cannot be read, or
  # on a manual run, plan a publish and let release-plz decide.
  plan:
    if: vars.TELLEGEN_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent: what this push merged.
          fetch-depth: 2
          persist-credentials: false
      - name: Decide whether this push publishes
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/tellegen/Cargo.toml | head -1)
          tag="v$version"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || status=$?
          if [ -z "$version" ]; then
            echo "::warning::cannot read the crate version; planning a publish"
            publish=true
          elif [ "$status" = 0 ]; then
            echo "$tag is tagged; nothing to publish"
            publish=false
          elif [ "$status" != 2 ]; then
            echo "::warning::cannot list tags (git exit $status); planning a publish of $tag"
            publish=true
          elif [ "$EVENT" != push ]; then
            echo "$tag has no tag; a manual run leaves the decision to release-plz"
            publish=true
          elif ! changed=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            echo "::warning::cannot diff this push; planning a publish of $tag"
            publish=true
          elif grep -qx 'crates/tellegen/CHANGELOG.md' <<<"$changed"; then
            echo "$tag has no tag and this push writes its changelog: a release merge"
            publish=true
          else
            echo "$tag has no tag, but this push leaves the crate changelog alone:"
            echo "not a release merge, so release-plz would not publish it"
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  gates:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/gates-rust.yml

  # Not gated: the version pull request this opens runs CI itself. When this
  # push publishes, wait for the gates as before, so the version update starts
  # alongside the publication rather than ahead of it.
  version-patch:
    if: >-
      ${{ !cancelled() &&
      vars.TELLEGEN_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      (needs.gates.result == 'success' || needs.gates.result == 'skipped') }}
    name: generate version patch
    needs: [plan, gates]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      patch-sha256: ${{ steps.patch.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      # Run the binary rather than the action here. The action accepts only
      # `release-pr` and `release`, and silently ignores anything else — a
      # `command: update` produced no output and no failure. `release-pr` is
      # not a substitute: it would open the pull request with its own token,
      # which is the privilege boundary this job exists to avoid. The CLI's
      # `update` writes the version bump and changelog locally and nothing else,
      # which is exactly what the sealed patch below needs.
      - name: Install release-plz
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: release-plz@0.3.160
      - name: Generate release-plz update
        run: release-plz update
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # release-plz sees a merged pull request as "Merge pull request #N" and
      # can miss one entirely. Replace the body of the section it wrote with one
      # entry per pull request that changed the crate, read from the merge
      # commits (whose messages are the pull request titles) since the last
      # release tag. The checkout above has the full history and the tags.
      - name: Write the changelog from merged pull requests
        run: python3 .github/scripts/write-crate-changelog.py
      # release-plz leaves the unpublished Python adapter alone. Move the wheel
      # onto the engine's version without resolving or updating any dependency.
      - name: Synchronize the Python wheel version
        run: |
          python3 .github/scripts/sync_python_version.py
          cargo metadata --locked --format-version 1 > /dev/null
      - name: Validate and seal version patch
        id: patch
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/validate-version-changes.py crate
          git diff --check
          patch="$RUNNER_TEMP/crate-version.patch"
          git diff --binary --full-index --no-ext-diff --output="$patch"
          sha256="$(sha256sum "$patch" | cut -d ' ' -f 1)"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "changed=true"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Upload sealed version patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-version-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/crate-version.patch
          if-no-files-found: error
          retention-days: 1

  version-pr:
    if: needs.version-patch.outputs.changed == 'true'
    name: update version pull request
    needs: version-patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download sealed version patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate-version-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/crate-version-patch
      - name: Verify, apply, and commit version patch
        env:
          EXPECTED_SHA256: ${{ needs.version-patch.outputs.patch-sha256 }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/crate-version-patch/crate-version.patch"
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_SHA256" "$patch" | sha256sum --check --strict
          git apply --index --binary "$patch"
          python3 .github/scripts/validate-version-changes.py crate
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "Release tellegen"
      # Use an App token so the generated pull request starts CI. Mint it only
      # after release-plz, Cargo, and repository code have finished running.
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Push and update version pull request
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION_BRANCH: release-plz-main
        run: |
          set -euo pipefail
          main_sha="$(GH_TOKEN="$APP_TOKEN" gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping stale version update for $GITHUB_SHA; main is $main_sha"
            exit 0
          fi

          ref="refs/heads/$VERSION_BRANCH"
          if expected_sha="$(GH_TOKEN="$APP_TOKEN" gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$VERSION_BRANCH" \
            --jq '.object.sha' 2>/dev/null)"; then
            [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
            lease="--force-with-lease=$ref:$expected_sha"
          else
            lease="--force-with-lease=$ref:"
          fi
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w 0)"
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:$ref" "$lease"

          prs_output="$(GH_TOKEN="$APP_TOKEN" gh api --method GET \
            "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$GITHUB_REPOSITORY_OWNER:$VERSION_BRANCH" \
            -f base=main --jq '.[].number')"
          prs=()
          if [ -n "$prs_output" ]; then
            mapfile -t prs <<< "$prs_output"
          fi
          [ "${#prs[@]}" -le 1 ] || {
            echo "multiple open pull requests use $VERSION_BRANCH" >&2
            exit 1
          }
          body="This automated pull request prepares the next tellegen crate release. Merge it with a merge commit (do not squash) to publish the version."
          if [ "${#prs[@]}" -eq 0 ]; then
            GH_TOKEN="$APP_TOKEN" gh api --method POST \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f title="Release tellegen" -f head="$VERSION_BRANCH" \
              -f base=main -f body="$body" >/dev/null
          else
            GH_TOKEN="$APP_TOKEN" gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/${prs[0]}" \
              -f title="Release tellegen" -f body="$body" >/dev/null
          fi

  publish:
    if: >-
      vars.TELLEGEN_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      needs.plan.outputs.publish == 'true'
    name: publish to crates.io
    needs: [plan, gates]
    runs-on: ubuntu-latest
    # The merged release PR is the human gate. This environment binds the OIDC
    # publisher to main; it should not add a second reviewer pause.
    environment: crates-io
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: release-plz release
        uses: MarcoIeni/release-plz-action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          version: "0.3.160"
        env:
          GITHUB_TOKEN: ${{ github.token }}
