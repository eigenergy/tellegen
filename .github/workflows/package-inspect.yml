name: Package Inspect

# Builds the exact artifacts a release would upload and attaches them as
# workflow artifacts, without publishing anything.
#
# This is what `crates-publish.yml` and `npm-publish.yml` did on a manual run
# before releases moved to release-plz and changesets. Their tag triggers and
# publish steps are gone: publishing now happens in `release-crate.yml` and
# `release-npm.yml` through trusted publishing behind an approval-gated
# environment, and a second route to the registries — one holding a long-lived
# token — would have been the weakest link rather than a safety net.
#
# Reach for this when you want to see what is in the tarball: `npm pack` and
# `cargo package` contents, file lists, sizes.

on:
  workflow_dispatch:

permissions: {}

jobs:
  crate:
    name: cargo package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: .
      # Builds from the packaged sources, the same check crates.io runs on
      # upload. `cargo package` over `cargo publish --dry-run` because only the
      # former leaves the `.crate` behind for the artifact below.
      - name: Package and verify
        run: |
          rm -rf target/package
          cargo package -p tellegen
      - name: List the packaged contents
        run: cargo package -p tellegen --list
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tellegen-crate-package
          path: target/package/tellegen-*.crate
          if-no-files-found: error

  packages:
    name: npm pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: .
      - uses: ./.github/actions/wasm-pack
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run wasm
      - run: npm run build:engine
      - run: npm run build:svelte
      - name: Pack dry runs
        run: |
          npm run pack:engine
          npm run pack:svelte
      - name: Pack artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tellegen-package"
          npm --workspace @tellegen/engine pack --pack-destination "$RUNNER_TEMP/tellegen-package"
          npm --workspace @tellegen/svelte pack --pack-destination "$RUNNER_TEMP/tellegen-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tellegen-npm-packages
          path: ${{ runner.temp }}/tellegen-package/tellegen-*.tgz
          if-no-files-found: error
