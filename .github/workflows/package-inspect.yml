name: Package Inspect

# Build the release artifacts and upload them. This workflow does not publish.
# Use it to examine the contents of a tarball.

on:
  workflow_dispatch:

permissions: {}

jobs:
  crate:
    name: cargo package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      # `cargo package`, not `cargo publish --dry-run`: only `package` keeps the
      # `.crate` file for the upload step below.
      - name: Package and verify
        run: |
          rm -rf target/package
          cargo package -p tellegen --locked
      - name: List the packaged contents
        run: cargo package -p tellegen --locked --list
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tellegen-crate-package
          path: target/package/tellegen-*.crate
          if-no-files-found: error

  packages:
    name: npm pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/js-setup
      - run: npm run wasm
      - run: npm run build:engine
      - run: npm run build:svelte
      - name: Pack artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tellegen-package"
          npm --workspace @tellegen/engine pack --pack-destination "$RUNNER_TEMP/tellegen-package"
          npm --workspace @tellegen/svelte pack --pack-destination "$RUNNER_TEMP/tellegen-package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tellegen-npm-packages
          path: ${{ runner.temp }}/tellegen-package/tellegen-*.tgz
          if-no-files-found: error
