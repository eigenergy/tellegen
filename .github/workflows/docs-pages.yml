name: Docs Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tellegen-docs-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.3
  # sha256 of the tarball for MDBOOK_VERSION. Change both together.
  MDBOOK_SHA256: e2fd508a4fac06cbaa9f88b97d27bdc3b55a08946304ca845879fe26a3699e11

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mdBook
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSLf "$url" -o "$RUNNER_TEMP/mdbook.tar.gz"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          tar -xz --directory "$RUNNER_TEMP/mdbook" -f "$RUNNER_TEMP/mdbook.tar.gz"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Build docs
        run: scripts/build-docs.sh
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages backend intermittently rejects or stalls deployments
      # ("Deployment failed, try again later", or a queue that never drains).
      # Retry with backoff so a service hiccup does not fail the run.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        continue-on-error: true
      - name: Wait before retrying the Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 120
      - name: Deploy to GitHub Pages (second attempt)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        continue-on-error: true
      - name: Wait before the final Pages deployment attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: sleep 300
      - name: Deploy to GitHub Pages (final attempt)
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
