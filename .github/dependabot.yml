version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The four powerio crates share one version. They must move together.
      powerio:
        patterns:
          - powerio
          - powerio-*

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/js-setup
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
