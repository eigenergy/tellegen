# Type gate for the pure-Python layer.
#
# No `files` key on purpose: the mypy job passes the path on the command line,
# and stubtest reuses this same config to compare stubs against the installed
# extension. A `files` key there would load the source tree a second time and
# collide with the import path.
#
# Match the abi3 wheel's oldest supported interpreter.
[mypy]
python_version = 3.11
warn_unused_ignores = True
no_implicit_optional = True

# Created by the pyo3 runtime at import; there is no distribution to stub.
[mypy-pyo3_runtime]
ignore_missing_imports = True

# The MCP extra's dependencies. Neither ships type information, and both are
# optional: the type gate must pass on an interpreter that has only the base
# package; CI also exercises the installed MCP extra.
[mypy-mcp.*]
ignore_missing_imports = True

[mypy-powerio.*]
ignore_missing_imports = True
