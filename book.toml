[book]
authors = ["eigenergy"]
description = "Reactive visualization for power flow cases"
language = "en"
src = "docs/src"
title = "tellegen"

[build]
build-dir = "docs/book"
create-missing = false

[output.html]
mathjax-support = true
theme = "docs/theme"
additional-css = ["docs/theme/tellegen.css"]
default-theme = "light"
edit-url-template = "https://github.com/eigenergy/tellegen/edit/main/{path}"
git-repository-url = "https://github.com/eigenergy/tellegen"
preferred-dark-theme = "navy"
site-url = "/tellegen/"

[output.html.redirect]
"/sensitivity-contract.html" = "sensitivity-interface.html"

"/direction.html" = "architecture.html"
"/technology-evaluation.html" = "architecture.html"
"/webmcp-challenge.html" = "studies.html"
"/challenge-evidence.html" = "validation.html"
"/powerio-011-review.html" = "collection-import.html"
"/tauri-roadmap.html" = "architecture.html"
"/data-provenance.html" = "data-sources.html"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[rust]
edition = "2024"
